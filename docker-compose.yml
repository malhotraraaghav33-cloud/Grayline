version: '3.8'

services:
  # PostgreSQL Database for Persistent Operational Data
  postgres:
    image: postgres:15-alpine
    container_name: grayline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grayline_admin
      POSTGRES_PASSWORD: secure_tactical_password_change_in_prod
      POSTGRES_DB: grayline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grayline_admin -d grayline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grayline_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://grayline_admin:secure_tactical_password_change_in_prod@postgres:5432/grayline_db
      - JWT_SECRET=TACTICAL_DEFENSE_GRAYLINE_LOCAL_DEV_SECRET_KEY_CHANGE_IN_PROD
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - INFERENCE_SERVICE_URL=
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Development Server (optional in compose)
  frontend:
    image: node:20-alpine
    container_name: grayline_frontend
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  postgres_data:
